name: Release

on:
  push:
    # main publishes stable releases; release/next uses Changesets pre mode.
    branches: [main, release/next]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/next'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x

      - name: Pin npm
        run: npm install --global npm@11.21.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Changesets still creates the version PR. The publish script runs the
      # prepublish gate, packs once, publishes that tarball and verifies npm
      # before reporting the git tag to the action.
      - name: Version or Publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: bun run changeset:version
          publish-script: bun run release
